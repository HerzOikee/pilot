<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilot Training</title>
  <style>
    :root {
      --bg: #0e1a24;
      --panel: #16283a;
      --border: #2c4560;
      --text: #e6eef5;
      --muted: #8fa6ba;
      --accent: #4fb3ff;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 48px 16px;
    }

    main { max-width: 640px; margin: 0 auto; }

    h1 { margin: 0 0 8px; font-size: 32px; }
    .lead { margin: 0 0 32px; color: var(--muted); }

    .apps { display: grid; gap: 12px; }

    .app {
      display: block;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }
    .app:hover, .app:focus-visible { border-color: var(--accent); outline: none; }
    .app h2 { margin: 0 0 4px; font-size: 20px; color: var(--accent); }
    .app p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Pilot Training</h1>
    <p class="lead">Practice tasks for the pilot school entrance exam.</p>

    <div class="apps">
      <a class="app" href="bird-game/index.html">
        <h2>Bird Game</h2>
        <p>Keep the dot inside the circle, keep the wings level and keep the speed vector hidden. Needs a joystick with a throttle.</p>
      </a>
    </div>
  </main>
</body>
</html>
