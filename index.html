<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <span id="hud-time">0:00</span>
    <span id="hud-live"></span>
    <span class="hint">Esc = pause</span>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>Bird Game</h1>
      <p class="lead">Keep the dot inside the circle and keep the wings level.</p>

      <div class="grid">
        <label>Duration
          <select id="opt-duration">
            <option value="60">1 minute</option>
            <option value="120" selected>2 minutes</option>
            <option value="180">3 minutes</option>
            <option value="300">5 minutes</option>
          </select>
        </label>
        <label>Difficulty
          <select id="opt-difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label>Wings controlled by
          <select id="opt-roll"></select>
        </label>
        <label class="check"><input type="checkbox" id="opt-invert"> Invert up/down</label>
        <label class="check"><input type="checkbox" id="opt-live" checked> Show live score</label>
      </div>

      <div id="pad-status" class="pad"></div>
      <div id="axes" class="axes"></div>

      <p class="keys">Keyboard: <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move the circle,
        <kbd>Q</kbd>/<kbd>E</kbd> tilt the wings.</p>

      <button id="start" class="primary">Start</button>

      <div id="history"></div>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="panel small">
      <h2>Paused</h2>
      <button id="resume" class="primary">Resume</button>
      <button id="quit">Quit to menu</button>
    </div>
  </div>

  <div id="results" class="overlay" hidden>
    <div class="panel small">
      <h2>Results</h2>
      <div id="results-body"></div>
      <button id="again" class="primary">Play again</button>
      <button id="to-menu">Menu</button>
    </div>
  </div>

  <div id="countdown" hidden></div>

  <script src="game.js"></script>
</body>
</html>
